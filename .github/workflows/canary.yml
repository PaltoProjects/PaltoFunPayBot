name: FunPay parser canary

on:
  schedule:
    # Ежедневно в 06:00 UTC (09:00 МСК)
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run canary against live funpay.com
        run: python tests/canary_funpay.py

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create funpay-canary --color d93f0b \
            --description "Канарейка парсера FunPay упала" --force || true
          {
            echo "Ежедневная проверка парсера против живого funpay.com упала — вероятно, FunPay изменил вёрстку."
            echo ""
            echo "Лог запуска: $RUN_URL"
            echo ""
            echo "Что проверить: якоря в \`FunPayAPI/account.py\` (data-app-data, user-link-name, promo-game-item, tc-item/tc-price) и синхронизацию с апстримом FunPayCardinal."
          } > /tmp/issue_body.md
          existing=$(gh issue list --label funpay-canary --state open --json number --jq '.[0].number')
          if [ -z "$existing" ]; then
            gh issue create \
              --title "🐤 Канарейка: парсер FunPayAPI сломался ($(date -u +%Y-%m-%d))" \
              --label funpay-canary \
              --body-file /tmp/issue_body.md
          else
            gh issue comment "$existing" --body "Канарейка снова упала: $RUN_URL"
          fi
